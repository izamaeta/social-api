version: "3"
services:
  api:
    image: izamaeta/fastapi
    depends_on:
      - postgres
    volumes:
      - ./:/usr/src/app:ro
    command: 
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - 4000:8000
    env_file:
      - ./.env

  postgres:
    image: postgres
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db: